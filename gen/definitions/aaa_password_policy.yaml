---
name: AAA Password Policy
rest_endpoint: /crosswork/aaa/v1/passwordPolicyConfig
get_rest_endpoint: /crosswork/aaa/v1/passwordPolicyConfig
get_no_id: true
put_create: true
put_no_id: true
put_delete: true
delete_no_id: true
delete_rest_endpoint: /crosswork/aaa/v1/passwordPolicyConfig
delete_body: '{"MinPasswordLength":8,"NoUsername":true,"NoCiscoVariant":true,"NoCharRepetition":true,"NumChangedCharsEnable":true,"NumChangedChars":1,"NumReuseLimitEnable":true,"NumReuseLimit":5,"PasswordReuseDaysEnable":true,"PasswordReuseDays":15,"FailedLoginsBefLoEnable":true,"FailedLoginsBeforeLockout":5,"LockOutUserTimeEnable":true,"LockOutUserTime":6,"PasswordExpiryDaysEnable":true,"PasswordExpiryDays":60,"DaysForWarningEnable":true,"DaysForWarning":15,"ChangePasswdOnFirstLogin":true}'
data_source_no_id: true
data_source_no_inputs: true
mutex: true
id_path: '!\"aaa_password_policy\"'
# The policy belongs to the whole cluster, so the acceptance test changes it and the destroy writes the documented defaults.
skip_minimum_test: true
test_tags: [SETTINGS]
doc_category: AAA
res_description: This resource can manage the AAA local password policy.
ds_description: This data source can read the AAA local password policy.
attributes:
  - model_name: MinPasswordLength
    tf_name: min_password_length
    type: Int64
    default_value: 8
    description: Minimum number of characters of a password
    example: 9
  - model_name: NoUsername
    tf_name: no_username
    type: Bool
    default_value: true
    description: Reject a password that contains the user name or its reverse
    example: true
  - model_name: NoCiscoVariant
    tf_name: no_cisco_variant
    type: Bool
    default_value: true
    description: Reject a password that contains `cisco`, `ocsic` or a capitalized variant of them
    example: true
  - model_name: NoCharRepetition
    tf_name: no_char_repetition
    type: Bool
    default_value: true
    description: Reject a password that repeats a character more than three times in a row
    example: true
  - model_name: NumChangedCharsEnable
    tf_name: num_changed_chars_enabled
    type: Bool
    default_value: true
    description: Require a number of changed characters in a new password
    example: true
  - model_name: NumChangedChars
    tf_name: num_changed_chars
    type: Int64
    default_value: 1
    description: Number of characters a new password must change
    example: 2
  - model_name: NumReuseLimitEnable
    tf_name: num_reuse_limit_enabled
    type: Bool
    default_value: true
    description: Limit the reuse of the last passwords
    example: true
  - model_name: NumReuseLimit
    tf_name: num_reuse_limit
    type: Int64
    default_value: 5
    description: Number of last passwords that cannot be reused
    example: 6
  - model_name: PasswordReuseDaysEnable
    tf_name: password_reuse_days_enabled
    type: Bool
    default_value: true
    description: Limit the reuse of passwords used in the last days
    example: true
  - model_name: PasswordReuseDays
    tf_name: password_reuse_days
    type: Int64
    default_value: 15
    description: Number of days a used password cannot be reused
    example: 16
  - model_name: FailedLoginsBefLoEnable
    tf_name: failed_logins_before_lockout_enabled
    type: Bool
    default_value: true
    description: Lock a user out after failed login attempts
    example: true
  - model_name: FailedLoginsBeforeLockout
    tf_name: failed_logins_before_lockout
    type: Int64
    default_value: 5
    description: Number of failed login attempts before the lockout
    example: 6
  - model_name: LockOutUserTimeEnable
    tf_name: lock_out_user_time_enabled
    type: Bool
    default_value: true
    description: Lock a user out for a time
    example: true
  - model_name: LockOutUserTime
    tf_name: lock_out_user_time
    type: Int64
    default_value: 6
    description: Minutes a user stays locked out
    example: 7
  - model_name: PasswordExpiryDaysEnable
    tf_name: password_expiry_days_enabled
    type: Bool
    default_value: true
    description: Expire passwords after a number of days
    example: true
  - model_name: PasswordExpiryDays
    tf_name: password_expiry_days
    type: Int64
    default_value: 60
    description: Days after which a password expires
    example: 61
  - model_name: DaysForWarningEnable
    tf_name: days_for_warning_enabled
    type: Bool
    default_value: true
    description: Warn users before their password expires
    example: true
  - model_name: DaysForWarning
    tf_name: days_for_warning
    type: Int64
    default_value: 15
    description: Days before the expiry that a warning is shown
    example: 16
  - model_name: ChangePasswdOnFirstLogin
    tf_name: change_password_on_first_login
    type: Bool
    default_value: true
    description: Require a new password at the first login
    example: true
