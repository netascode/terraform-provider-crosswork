---
name: Port Groups
rest_endpoint: /crosswork/grouping/v1/grouping/group
get_extra_query_params: /details
id_path: group.uuid
doc_category: Device Management
res_description: This resource can manage a port group, the ports are assigned with `crosswork_assign_ports_to_port_group`.
attributes:
  - model_name: classifier
    type: String
    value: UserDefinedPorts
    description: Group classifier
  - model_name: name
    type: String
    response_data_path: group.name
    mandatory: true
    description: Group name, unique among the port groups without regard to case
    example: cwtest-port-group
  - model_name: description
    type: String
    response_data_path: group.description
    null_on_empty: true
    description: Group description
    example: Test port group
  - model_name: parentUuid
    tf_name: parent_uuid
    type: String
    response_data_path: group.parentUuid
    mandatory: true
    description: Id of the parent group, which is the built-in `User Defined` group, the group of the `crosswork_groupings` data source for the classifier `UserDefinedPorts` that is built in (`discovery_type` is `StaticSystem`) and allows subgroups (`subgroups_allowed`)
    example: d958313a-5d5c-48aa-83ec-4918faa5286c
    test_value: '[for group in data.crosswork_groupings.port_anchor.items : group.id if group.discovery_type == "StaticSystem" && group.subgroups_allowed][0]'

test_prerequisites: |
  data "crosswork_groupings" "port_anchor" {
    classifier = "UserDefinedPorts"
  }
