---
# hand-written:
#   resource: read, create, delete
#   data source: read
#   model: readGet
#   helpers: te_affinity_logic.go
#   tests: te_affinity_test.go (offline tests of the calls)
#   why: the controller assigns the id of an affinity, answers a refusal with HTTP 200 and a status in the body, and reads all affinities of a kind in one call
name: TE Flex Algo Affinity
rest_endpoint: /crosswork/optima/api/v1/affinityMap
get_rest_endpoint: /crosswork/optima/api/v1/affinityMap/flexAlgo
no_update: true
mutex: true
# The affinities belong to the whole cluster, so the acceptance test creates one affinity and the destroy removes it.
skip_minimum_test: true
test_tags: [SETTINGS]
doc_category: Settings
res_description: This resource can manage one flexible-algorithm affinity for traffic engineering.
ds_description: This data source can read one flexible-algorithm affinity for traffic engineering.
attributes:
  - model_name: name
    type: String
    mandatory: true
    requires_replace: true
    string_min_length: 1
    string_max_length: 128
    description: Name of the affinity
    example: cwtest-flex_algo
  - model_name: bitPosition
    tf_name: bit_position
    type: Int64
    mandatory: true
    requires_replace: true
    min_int: 0
    max_int: 255
    description: Bit position of the affinity
    example: 128
