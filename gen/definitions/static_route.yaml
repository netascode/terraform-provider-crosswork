---
# hand-written:
#   resource: create, delete
#   data source: -
#   model: readGet
#   helpers: static_route_logic.go
#   tests: static_route_test.go (offline tests of the calls and the waits)
#   why: the controller assigns the id of a route and adds and removes it in the background (a status goes from add-inprogress to success), and a refusal is an HTTP 200 with a code in the body
name: Static Route
rest_endpoint: /crosswork/ztp/v1/staticroutes
get_rest_endpoint: /crosswork/ztp/v1/staticroutes/query
get_body: '{"filter":{}}'
no_update: true
mutex: true
# The routes belong to the whole cluster, so the acceptance test creates one route from the documentation range and the destroy removes it.
skip_minimum_test: true
test_tags: [SETTINGS]
doc_category: Settings
res_description: This resource can manage a static route for Zero Touch Provisioning.
ds_description: This data source can read a static route of the zero touch provisioning.
attributes:
  - model_name: subnet
    tf_name: address
    type: String
    mandatory: true
    requires_replace: true
    description: Address of the route
    example: 192.0.2.0
  - model_name: mask
    tf_name: prefix_length
    type: Int64
    model_type_string: true
    mandatory: true
    requires_replace: true
    min_int: 0
    max_int: 128
    description: Prefix length of the route
    example: 24
