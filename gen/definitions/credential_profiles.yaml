---
name: Credential Profiles
rest_endpoint: /crosswork/inventory/v1/credentials
get_rest_endpoint: /crosswork/inventory/v1/credentials/query
get_body: '{"filter":{"profile":"{id}"}}'
get_no_id: true
id_from_attribute: true
put_no_id: true
allow_existing_on_create: true
remove_resource_on_empty_response: true
delete_no_id: true
delete_body: '{"data":[{"profile":"{id}"}]}'
get_before_delete: true
doc_category: Administration
res_description: This resource can manage a credential profile.
attributes:
  - model_name: profile
    data_path: data.0
    type: String
    id: true
    requires_replace: true
    mandatory: true
    description: Credential profile name
    example: cwtest-profile
  - model_name: user_pass
    tf_name: credentials
    data_path: data.0
    type: List
    description: List of credentials, one per access type
    attributes:
      - model_name: type
        type: String
        id: true
        mandatory: true
        description: Access type
        enum_values: [ROBOT_USERPASS_TCP, ROBOT_USERPASS_UDP, ROBOT_USERPASS_HTTP, ROBOT_USERPASS_HTTPS, ROBOT_USERPASS_GRPC, ROBOT_USERPASS_SSH, ROBOT_USERPASS_NETCONF, ROBOT_USERPASS_TELNET, ROBOT_USERPASS_SNMP, ROBOT_USERPASS_TL1, ROBOT_USERPASS_TL1_SECURE, ROBOT_USERPASS_ADMIN, ROBOT_USERPASS_ENABLE, ROBOT_USERPASS_GNMI]
        example: ROBOT_USERPASS_SSH
      - model_name: user_name
        type: String
        mandatory: true
        description: User name
        example: cwtest-user
      - model_name: password
        type: String
        write_only: true
        write_only_tf: true
        description: Password
        example: Cwtest-Password-1
      - model_name: enable_password
        type: String
        description: Second level authentication, for devices that support it
        enum_values: [ROBOT_USERPASSEN_ENABLE, ROBOT_USERPASSEN_DISABLE]
        example: ROBOT_USERPASSEN_ENABLE
      - model_name: enable_password_data
        tf_name: enable_password_value
        type: String
        write_only: true
        write_only_tf: true
        description: Enable password
        example: Cwtest-Enable-1
  - model_name: read_community
    data_path: data.0.v2_info
    tf_name: snmpv2_read_community
    type: String
    write_only: true
    write_only_tf: true
    description: SNMPv2 read community
    example: cwtest-read
  - model_name: write_community
    data_path: data.0.v2_info
    tf_name: snmpv2_write_community
    type: String
    write_only: true
    write_only_tf: true
    description: SNMPv2 write community
    example: cwtest-write
  - model_name: user_name
    data_path: data.0.v3_info
    tf_name: snmpv3_user_name
    type: String
    description: SNMPv3 user name
    example: cwtest-snmp
  - model_name: security_level
    data_path: data.0.v3_info
    tf_name: snmpv3_security_level
    type: String
    description: SNMPv3 security level
    enum_values: [SL_NO_AUTH_NO_PRIV, SL_AUTH_NO_PRIV, SL_AUTH_PRIV]
    example: SL_AUTH_PRIV
  - model_name: auth_type
    data_path: data.0.v3_info
    tf_name: snmpv3_auth_type
    type: String
    description: SNMPv3 authentication type
    enum_values: [AT_HMAC_MD5, AT_HMAC_SHA, AT_HMAC_SHA2_512, AT_HMAC_SHA2_384, AT_HMAC_SHA2_256, AT_HMAC_SHA2_224]
    example: AT_HMAC_SHA
  - model_name: auth_password
    data_path: data.0.v3_info
    tf_name: snmpv3_auth_password
    type: String
    write_only: true
    write_only_tf: true
    description: SNMPv3 authentication password
    example: Cwtest-Auth-1
  - model_name: priv_type
    data_path: data.0.v3_info
    tf_name: snmpv3_priv_type
    type: String
    description: SNMPv3 privacy type
    enum_values: [PT_CFB_AES_128, PT_CBC_DES_56, PT_CFB_AES_192, PT_CFB_AES_256, PT_CBC_3_DES]
    example: PT_CFB_AES_128
  - model_name: priv_password
    data_path: data.0.v3_info
    tf_name: snmpv3_priv_password
    type: String
    write_only: true
    write_only_tf: true
    description: SNMPv3 privacy password
    example: Cwtest-Priv-1
