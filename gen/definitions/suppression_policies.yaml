---
name: Suppression Policies
rest_endpoint: /crosswork/alarm/v1/suppressionpolicy/%v
post_rest_endpoint: /crosswork/alarm/v1/suppressionpolicy
get_rest_endpoint: /crosswork/alarm/v1/suppressionpolicy
put_rest_endpoint: /crosswork/alarm/v1/suppressionpolicy
get_from_all: true
get_no_id: true
id_from_query_path: data
put_no_id: true
delete_no_id: true
id_from_attribute: true
mutex: true
skip_minimum_test: true
doc_category: Alerts
res_description: This resource can manage an alarm suppression policy.
ds_description: This data source can read an alarm suppression policy.
attributes:
  - model_name: policyname
    tf_name: name
    type: String
    id: true
    reference: true
    reference_in_body: true
    escape_reference_path: true
    mandatory: true
    requires_replace: true
    string_min_length: 1
    string_max_length: 255
    description: Name of the policy, unique on the Crosswork cluster. The controller accepts letters, digits, `-` and `_`, up to 255 characters, and it cannot be changed
    example: cwtest-suppress
  - model_name: description
    type: String
    null_on_empty: true
    description: Description of the policy
    example: Suppress the warm start alarms
  - model_name: action
    type: String
    mandatory: true
    enum_values: [suppressAlarm, suppressEvent]
    description: What the policy suppresses, `suppressAlarm` for the alarms only (the events are still created) and `suppressEvent` for the alarms and the events
    example: suppressAlarm
  - model_name: deviceGroups
    tf_name: device_groups
    type: Set
    element_type: String
    description: Ids of the device groups whose devices the policy applies to. The controller accepts one group, or none
    exclude_test: true
  - model_name: criteria
    type: String
    mandatory: true
    description: Event types that the policy suppresses, written as `eventType in [A,B,C]` with the names of the event type catalog separated by a comma and no space
    example: eventType in [WARMSTART]
