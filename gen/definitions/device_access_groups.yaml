---
name: Device Access Groups
rest_endpoint: /crosswork/grouping/v1/grouping/group
get_extra_query_params: /details
id_path: group.uuid
doc_category: Administration
res_description: This resource can manage a device access group.
attributes:
  - model_name: classifier
    type: String
    value: DeviceAccess
    description: Group classifier
  - model_name: name
    type: String
    response_data_path: group.name
    mandatory: true
    description: Group name, unique on the Crosswork cluster
    example: cwtest-access-group
  - model_name: description
    type: String
    response_data_path: group.description
    null_on_empty: true
    description: Group description
    example: Test access group
  - model_name: parentUuid
    tf_name: parent_uuid
    type: String
    response_data_path: group.parentUuid
    mandatory: true
    description: Id of the parent group; use the id of the root device access group, the group of the `crosswork_groupings` data source that is built in (`discovery_type` is `StaticSystem`) and allows subgroups (`subgroups_allowed`)
    example: b84e1a37-ef0d-4b79-984c-b162249d2e23
    test_value: '[for group in data.crosswork_groupings.root.items : group.id if group.discovery_type == "StaticSystem" && group.subgroups_allowed][0]'

test_prerequisites: |
  data "crosswork_groupings" "root" {
    classifier = "DeviceAccess"
  }
